<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База растений</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;background:#f4f4f4;color:#161616;margin:0;padding:36px 20px}main{max-width:680px;margin:auto;background:white;padding:32px;border:1px solid #ccc}h1{margin-top:0}label{display:block;margin-top:20px}input,select,button{box-sizing:border-box;font:inherit;padding:10px;width:100%;margin-top:6px}button{background:#161616;color:white;border:0;cursor:pointer;margin-top:24px}button:disabled{opacity:.5}#status{white-space:pre-wrap;margin-top:24px}a{color:#161616;font-weight:600}small{color:#555}
</style>
<main>
<h1>База растений</h1>
<p>Укажите каталог или карточку растения. Парсер соберёт подтверждённые данные и подготовит Excel с источниками и журналом обхода.</p>
<form id="form">
<label>URL сайта<input id="url" type="url" required placeholder="https://example.com/plants"></label>
<label>Максимум страниц<input id="pages" type="number" min="1" max="500" value="50" required></label>
<label>Единицы длины в таблице<select id="unit"><option value="m">Метры</option><option value="cm">Сантиметры</option><option value="mm">Миллиметры</option></select></label>
<button id="start">Собрать растения</button>
</form>
<p><small>Обход соблюдает robots.txt. Для первого запуска достаточно 5–10 страниц. Выполняется одно задание за раз.</small></p>
<div id="status" role="status" aria-live="polite"></div>
<a id="download" hidden>Скачать XLSX</a>
</main>
<script>
const form=document.querySelector('#form'), statusText=document.querySelector('#status'), button=document.querySelector('#start'), download=document.querySelector('#download');
async function poll(id){
  try {
    const response=await fetch('/api/jobs/'+id);
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'Не удалось получить статус');
    if(data.status==='running'){
      statusText.textContent='Идёт сбор данных. Можно оставить страницу открытой.';
      setTimeout(()=>poll(id),2000);return;
    }
    button.disabled=false;
    if(data.status==='completed'){
      statusText.textContent=`${data.warning||'Готово.'} Растений в базе: ${data.plants}. Загружено страниц: ${data.downloaded}. Из истории: ${data.cached}. Ошибок обхода: ${data.errors}. Подробности — на листе Crawl log.`;
      download.href=data.download;download.hidden=false;
    }else {statusText.textContent=data.error||'Задание завершилось с ошибкой';localStorage.removeItem('plantJob');}
    if(data.download){download.href=data.download;download.hidden=false;}
  }catch(error){statusText.textContent=error.message+'. Обновите страницу, чтобы повторить проверку.';button.disabled=false;}
}
form.addEventListener('submit',async event=>{
  event.preventDefault();button.disabled=true;download.hidden=true;statusText.textContent='Запуск…';
  try{
    const response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value,max_pages:Number(document.querySelector('#pages').value),display_unit:document.querySelector('#unit').value})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Ошибка запуска');
    localStorage.setItem('plantJob',data.id);poll(data.id);
  }catch(error){statusText.textContent=error.message;button.disabled=false;}
});
const previous=localStorage.getItem('plantJob');if(previous){button.disabled=true;poll(previous);}
</script>
</html>
